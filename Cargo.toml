[package]
name = "subbar"
version = "0.3.0"
edition = "2021"
description = "Claude Code subagents on OpenCode Go models + subscription limits in the macOS menu bar"

[dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }  # порядок ключей: правим чужой settings.json, не пересортировывая
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "form",
    "gzip",
    "default-tls",
    "stream",
] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "io-util", "signal"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
block2 = "0.6.2"
libc = "0.2.189"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
# unwind, не abort: catch_unwind вокруг обновления аккаунта (state.rs) должен ловить панику провайдера,
# а не ронять всё приложение.
panic = "unwind"
